<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Rescue Cinderella</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="storybook-shell">
      <section class="scene-card">
        <div class="scene-art" aria-hidden="true">
          <img
            class="scene-image"
            alt=""
          />
          <img class="scene-preload" alt="" />
          <div class="sparkle-burst" id="sparkle-burst" aria-hidden="true">
            <span class="burst-star star-1"></span>
            <span class="burst-star star-2"></span>
            <span class="burst-star star-3"></span>
            <span class="burst-star star-4"></span>
            <span class="burst-star star-5"></span>
            <span class="burst-star star-6"></span>
          </div>
        </div>

        <div class="hud">
          <header class="game-header">
            <h1>Giải cứu công chúa</h1>
          </header>

          <p class="status-ribbon" id="status-text">
            Hãy nhập mã 4 số để mở khóa và cứu Cinderella.
          </p>
        </div>

        <section class="door-zone" aria-label="Cửa lâu đài bị khóa">
          <div class="lock-panel" id="lock-panel">
            <div class="code-display" aria-label="Mã số 4 chữ số">
              <div class="digit-slot" data-slot>_</div>
              <div class="digit-slot" data-slot>_</div>
              <div class="digit-slot" data-slot>_</div>
              <div class="digit-slot" data-slot>_</div>
            </div>
          </div>
        </section>

        <aside class="keypad-panel">
          <div class="panel-head">
            <p class="panel-label">Mật mã</p>
          </div>

          <div class="keypad-grid" aria-label="Bàn phím nhập mã">
            <button class="key key-number" type="button" data-key="1">1</button>
            <button class="key key-number" type="button" data-key="2">2</button>
            <button class="key key-number" type="button" data-key="3">3</button>
            <button class="key key-number" type="button" data-key="4">4</button>
            <button class="key key-number" type="button" data-key="5">5</button>
            <button class="key key-number" type="button" data-key="6">6</button>
            <button class="key key-number" type="button" data-key="7">7</button>
            <button class="key key-number" type="button" data-key="8">8</button>
            <button class="key key-number" type="button" data-key="9">9</button>
            <button class="key key-action" type="button" data-action="delete">Xóa</button>
            <button class="key key-number key-zero" type="button" data-key="0">0</button>
            <button class="key key-action" type="button" data-action="reset">Reset</button>
          </div>
        </aside>

        <div class="win-banner" id="win-banner" role="status" aria-live="polite">
          Chúc mừng! Bạn đã phá được khóa và cứu Cinderella!
        </div>

        <button class="replay-button" id="replay-button" type="button">
          Chơi lại
        </button>

        <div class="error-popup" id="error-popup" aria-live="polite">
          Ôi không, sai rồi!
        </div>
      </section>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
